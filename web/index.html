<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Presidente</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ef; color: #1f2933; }
    main { text-align: center; padding: 16px; }
    code { background: #e6e1d8; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Hotel Presidente</h1>
    <p>Boilerplate del frontend desplegado en Azure Static Web Apps.</p>
    <p>API: <code id="api">sin comprobar</code></p>
  </main>
  <script>
    // La URL de la API la escribe el despliegue en config.js (ver infra/README.md).
    const s = document.createElement('script');
    s.src = 'config.js';
    s.onload = () => {
      const el = document.getElementById('api');
      fetch(window.API_URL + '/actuator/health')
        .then(r => r.json())
        .then(h => { el.textContent = h.status; })
        .catch(() => { el.textContent = 'sin respuesta'; });
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
